
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build files
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      # 업로드 직후 바로 배포하면 빌드 파일이 아직 조회되지 않아
      # "No artifacts named github-pages" 로 실패하는 경우가 있어서 잠시 대기
      - name: Wait for artifact
        run: sleep 30

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
